<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: #050505;
      color: #e8e8e8;
      overflow-x: hidden;
      position: relative;
    }

    /* Фон */
    .bg {
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.88) 100%),
        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
      filter: grayscale(100%) contrast(1.2) brightness(0.65);
      z-index: 0;
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
    }

    /* Зерно / noise */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Дождь */
    .rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4));
      border-radius: 50%;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-130vh); opacity: 0; }
      12% { opacity: 0.8; }
      88% { opacity: 0.35; }
      100% { transform: translateY(130vh); opacity: 0; }
    }

    /* Плавающие частицы */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.35);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-20vh) scale(1); opacity: 0; }
    }

    /* Контент */
    .container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px 70px;
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 38px;
      position: relative;
    }

    .header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      font-weight: 400;
      letter-spacing: 1px;
      line-height: 1.05;
      margin-bottom: 4px;
      background: linear-gradient(180deg, #ffffff 20%, #999 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleGlow 4s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.15));
    }

    @keyframes titleGlow {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(255,255,255,0.12)); }
      50% { filter: drop-shadow(0 0 22px rgba(255,255,255,0.25)); }
    }

    .header p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Кнопки */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      color: #f0f0f0;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      background: rgba(30, 32, 36, 0.7);
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      letter-spacing: 0.4px;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .btn:hover::before {
      transform: translateX(100%);
    }

    .btn:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.22);
      box-shadow: 0 8px 28px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.05);
      background: rgba(45, 48, 55, 0.85);
    }

    .btn:active {
      transform: translateY(-1px) scale(0.985);
    }

    .btn-icon {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .btn .sub {
      display: block;
      font-size: 0.7rem;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
      letter-spacing: 0;
    }

    /* Акцент на Twitch (всё равно ч/б, но чуть ярче) */
    .btn-twitch {
      background: rgba(40, 40, 45, 0.8);
      border-color: rgba(255,255,255,0.12);
    }

    .btn-twitch:hover {
      background: rgba(55, 55, 62, 0.9);
      box-shadow: 0 8px 28px rgba(0,0,0,0.5), 0 0 24px rgba(255,255,255,0.07);
    }

    /* Кошельки */
    .wallets {
      margin-top: 30px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .wallet-item {
      text-align: center;
    }

    .wallet-label {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .wallet-box {
      background: rgba(20, 22, 26, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 11px;
      padding: 13px 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.76rem;
      word-break: break-all;
      color: #c8c8c8;
      cursor: pointer;
      transition: all 0.25s;
      line-height: 1.45;
      position: relative;
    }

    .wallet-box:hover {
      background: rgba(35, 38, 45, 0.9);
      border-color: rgba(255,255,255,0.18);
      color: #fff;
    }

    .wallet-box.copied {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }

    .copy-hint {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.25);
      margin-top: 5px;
      transition: color 0.2s;
    }

    .wallet-box.copied + .copy-hint {
      color: rgba(255,255,255,0.6);
    }

    /* Футер */
    .footer {
      margin-top: 44px;
      text-align: center;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
    }

    /* Сканирующая линия (лёгкая приколюха) */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      z-index: 5;
      pointer-events: none;
      animation: scan 7s linear infinite;
      opacity: 0.6;
    }

    @keyframes scan {
      0% { top: -2px; }
      100% { top: 100%; }
    }

    /* Адаптив */
    @media (max-width: 480px) {
      .header h1 {
        font-size: 2.75rem;
      }
      .btn {
        padding: 14px 15px;
        font-size: 0.9rem;
      }
      .wallet-box {
        font-size: 0.7rem;
        padding: 12px;
      }
      .container {
        padding: 40px 16px 60px;
      }
    }
  </style>
</head>

  <script>
    // Дождь
    const rain = document.getElementById('rain');
    for (let i = 0; i < 65; i++) {
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.style.left = Math.random() * 100 + '%';
      drop.style.height = (Math.random() * 40 + 20) + 'px';
      drop.style.animationDuration = (Math.random() * 0.85 + 0.5) + 's';
      drop.style.animationDelay = (Math.random() * 3) + 's';
      drop.style.opacity = Math.random() * 0.4 + 0.15;
      rain.appendChild(drop);
    }

    // Плавающие частицы
    const particles = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 12 + 10) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.width = p.style.height = (Math.random() * 2 + 1) + 'px';
      particles.appendChild(p);
    }

    // Копирование
    function copyAddress(id, address) {
      navigator.clipboard.writeText(address).then(() => {
        showCopied(id);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = address;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showCopied(id);
      });
    }

    function showCopied(id) {
      const box = document.getElementById(id);
      const hint = document.getElementById('hint-' + id);
      box.classList.add('copied');
      hint.textContent = 'Скопировано ✓';
      setTimeout(() => {
        box.classList.remove('copied');
        hint.textContent = 'Нажми, чтобы скопировать';
      }, 2000);
    }
  </script>
